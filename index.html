<title>Green Volley U14F</title>
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1c1c1c; --sub:#6b6b6b; --line:#e6e2d8;
  --accent:#3fa34d; --accent-ink:#ffffff; --away:#c98a2c; --home:#3fa34d;
  --danger:#c0392b;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15181a; --card:#1f2326; --ink:#eee; --sub:#9aa0a6; --line:#2c3033;
    --accent:#4fbb5e; --accent-ink:#0c130d; --away:#e0a13f;
  }
}
:root[data-theme="dark"]{
  --bg:#15181a; --card:#1f2326; --ink:#eee; --sub:#9aa0a6; --line:#2c3033;
  --accent:#4fbb5e; --accent-ink:#0c130d; --away:#e0a13f;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--ink); min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
header{
  position:relative;
  padding:calc(env(safe-area-inset-top,0px) + 18px) 16px 14px; text-align:center;
  border-bottom:1px solid var(--line);
}
.menu-toggle{
  position:absolute; top:calc(env(safe-area-inset-top,0px) + 10px); right:12px;
  background:transparent; color:var(--sub); font-size:1.3rem; line-height:1; padding:4px 10px;
}
.side-menu-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.5); display:none;
  justify-content:flex-end; z-index:60;
}
.side-menu-overlay.open{display:flex;}
.side-menu{
  background:var(--bg); width:min(78vw, 300px); height:100%; padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 16px;
  display:flex; flex-direction:column; gap:10px; box-shadow:-4px 0 16px rgba(0,0,0,.15); overflow-y:auto;
}
.side-menu .export-btn{width:100%; margin-top:0; text-align:center; flex-shrink:0;}
.side-menu-notif-title{font-size:.78rem; font-weight:700; color:var(--sub); margin-bottom:6px; text-transform:uppercase; letter-spacing:.02em;}
.notif-list{display:flex; flex-direction:column; gap:6px; margin-bottom:4px;}
.notif-item{background:var(--card); border:1px solid var(--line); border-radius:8px; padding:7px 9px; font-size:.76rem; line-height:1.35;}
.notif-item .notif-time{color:var(--sub); font-size:.7rem; display:block; margin-top:1px;}
.notif-empty{color:var(--sub); font-size:.78rem;}
.weather-btn{
  background:var(--line); color:var(--ink); font-size:.78rem; padding:2px 10px; border-radius:999px;
  margin-left:4px; vertical-align:middle;
}
.weather-detail{text-align:center; margin-bottom:12px;}
.weather-icon-big{font-size:2.6rem; line-height:1;}
.weather-label{color:var(--sub); font-size:.92rem; font-weight:600; margin-top:2px;}
.classifica-frame{
  width:100%; height:65vh; border:1px solid var(--line); border-radius:10px; background:#fff;
}
.manual-content h2{font-size:1.1rem; margin:0 0 8px;}
.manual-content h3{font-size:.95rem; margin:16px 0 6px; color:var(--home);}
.manual-content p{font-size:.88rem; line-height:1.5; margin:4px 0;}
.manual-content ul{margin:6px 0; padding-left:20px;}
.manual-content li{font-size:.88rem; line-height:1.5; margin:3px 0;}
.side-menu-logo{
  display:block; margin:16px auto 0; width:84px; height:84px; border-radius:50%;
}
.side-menu-slogan{
  margin-top:auto; padding-top:16px; text-align:center; color:var(--sub); font-size:.78rem;
  font-weight:600; line-height:1.5; letter-spacing:.02em;
}
.addr-list{background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden;}
.addr-row{
  display:block; width:100%; text-align:left; background:transparent; color:var(--ink);
  padding:10px 12px; border-bottom:1px solid var(--line); text-decoration:none; font:inherit;
}
.addr-row:last-child{border-bottom:none;}
.addr-row .addr-team{font-weight:600; font-size:.88rem;}
.addr-row .addr-place{color:var(--sub); font-size:.78rem; margin-top:2px;}
.edit-match-btn{display:block; margin-top:6px; font-size:.78rem; padding:2px 0;}
.badge-grid{display:flex; flex-direction:column; gap:8px;}
.badge-card{display:flex; gap:10px; align-items:flex-start; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px;}
.badge-icon{font-size:1.4rem; line-height:1;}
.badge-title{font-size:.72rem; color:var(--sub); text-transform:uppercase; letter-spacing:.02em;}
.badge-value{font-size:1.05rem; font-weight:800; margin-top:1px;}
.badge-detail{font-size:.78rem; color:var(--sub); margin-top:2px;}
.like-bar{display:flex; gap:8px; margin-top:8px;}
.like-edit-row{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:8px; flex-wrap:wrap;}
.like-edit-row .like-bar{margin-top:0;}
.like-edit-row .edit-match-btn{margin-top:0;}
.like-btn{
  display:flex; align-items:center; gap:4px; background:transparent; border:1px solid var(--line);
  border-radius:999px; padding:4px 12px; font-size:.85rem; color:var(--ink); font-weight:600;
}
.like-btn.active-like{border-color:var(--home); color:var(--home); background:rgba(63,163,77,.12);}
.like-btn.active-unlike{border-color:var(--danger); color:var(--danger); background:rgba(192,57,43,.12);}

.ticker-wrap{
  overflow:hidden; white-space:nowrap; background:var(--card); border-bottom:1px solid var(--line);
  padding:5px 0;
}
.ticker-track{display:inline-flex; will-change:transform; animation:ticker-scroll 30s linear infinite;}
.ticker-track span{padding-right:48px; font-size:.76rem; color:var(--ink); font-weight:600;}
@keyframes ticker-scroll{ from{transform:translateX(0);} to{transform:translateX(-50%);} }
@media (prefers-reduced-motion: reduce){
  .ticker-track{animation:none;}
}
header h1{margin:0; font-size:1.25rem;}
header p{margin:4px 0 0; color:var(--sub); font-size:.85rem;}
main{max-width:640px; margin:0 auto; padding:14px 12px 40px;}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:14px; margin-bottom:12px;
}
.card.next{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent);}
.row-top{display:flex; justify-content:space-between; align-items:baseline; gap:8px; flex-wrap:wrap;}
.giornata{font-size:.72rem; color:var(--sub); text-transform:uppercase; letter-spacing:.04em;}
.badge{
  font-size:.72rem; font-weight:600; padding:2px 8px; border-radius:999px; color:#fff;
}
.badge.casa{background:var(--home);} .badge.trasferta{background:var(--away);}
.data{font-weight:600; margin-top:6px; font-size:1rem;}
.match{font-size:1.05rem; margin-top:4px;}
.match b{font-weight:700;}
.luogo{color:var(--sub); font-size:.85rem; margin-top:6px; line-height:1.4;}
.maps-link{color:var(--accent); text-decoration:none; font-weight:600;}
.result{
  margin-top:10px; padding-top:10px; border-top:1px dashed var(--line);
  display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;
}
.score{font-size:1.15rem; font-weight:700;}
.score.win{color:var(--home);} .score.loss{color:var(--danger);}
.note{color:var(--sub); font-size:.8rem; margin-top:2px;}
button{
  font:inherit; border:none; border-radius:10px; padding:8px 12px; cursor:pointer;
}
.btn-primary{background:var(--accent); color:var(--accent-ink); font-weight:600;}
.btn-ghost{background:transparent; color:var(--sub); text-decoration:underline; padding:4px;}
.btn-ghost.danger{color:var(--danger);}
.confirm-text{font-size:.8rem; color:var(--danger); font-weight:600;}
.actions{display:flex; gap:8px;}
form.entry{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); display:none;}
form.entry.open{display:block;}
form.entry input{
  width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--line);
  background:var(--bg); color:var(--ink); font:inherit; margin-bottom:8px;
}
form.entry label{font-size:.78rem; color:var(--sub);}
.form-actions{display:flex; gap:8px; justify-content:flex-end;}
.sets-grid{
  display:grid; grid-template-columns:64px 1fr 1fr; gap:6px 8px; align-items:center;
  margin-bottom:10px;
}
.sets-head{font-size:.75rem; color:var(--sub); text-align:center; font-weight:600;}
.set-label{font-size:.8rem; color:var(--sub);}
form.entry .sets-grid input{
  width:100%; text-align:center; padding:8px 4px; border-radius:8px; border:1px solid var(--line);
  background:var(--bg); color:var(--ink); font:inherit; margin-bottom:0;
}
.sets-grid-4{grid-template-columns:56px 1fr 1fr 28px;}
.sets-grid.readonly{margin-bottom:0;}
.set-val{text-align:center; font-weight:600;}
.set-icon{text-align:center; font-weight:700; font-size:1.05rem;}
.set-icon.won{color:var(--home);}
.set-icon.lost{color:var(--danger);}
.set-label.tot, .set-val.tot{border-top:1px dashed var(--line); padding-top:6px; font-weight:700;}
.set-diff{text-align:center; font-weight:800; font-size:.85rem;}
.set-diff.won{color:var(--home);}
.set-diff.lost{color:var(--danger);}
.esito-banner{
  text-align:center; font-weight:700; padding:8px; border-radius:10px; margin-bottom:10px; font-size:.9rem;
}
.esito-banner.win{background:rgba(63,163,77,.15); color:var(--home);}
.esito-banner.loss{background:rgba(192,57,43,.15); color:var(--danger);}
.esito-banner.draw{background:rgba(0,0,0,.06); color:var(--sub);}
.result-block .result{border-top:none; padding-top:0; margin-top:0;}
.result-block{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line);}
.btn-secondary{background:var(--line); color:var(--ink);}
#status{
  position:fixed; left:0; right:0; bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  display:flex; justify-content:center; pointer-events:none;
}
#status span{
  background:var(--ink); color:var(--bg); padding:8px 14px; border-radius:999px;
  font-size:.85rem; opacity:0; transition:opacity .3s;
}
#status span.show{opacity:.92;}
.readonly-note{text-align:center; color:var(--sub); font-size:.78rem; margin:0 0 10px;}

.view-toggle{display:flex; justify-content:center; gap:6px; margin-top:10px;}
.view-toggle button{background:var(--line); color:var(--ink); font-size:.85rem; padding:6px 14px;}
.view-toggle button.active{background:var(--accent); color:var(--accent-ink); font-weight:600;}

.cal-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:6px;}
.cal-nav button{background:var(--line); color:var(--ink); padding:6px 12px;}
.cal-nav-center{display:flex; flex-direction:column; align-items:center; gap:2px;}
.cal-nav h2{margin:0; font-size:1.05rem; text-transform:capitalize;}
.btn-today{background:var(--accent); color:var(--accent-ink); font-size:.72rem; padding:3px 10px; font-weight:600;}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
.cal-dow{text-align:center; font-size:.7rem; color:var(--sub); padding-bottom:4px; text-transform:uppercase;}
.cal-day{
  aspect-ratio:1; border-radius:10px; background:var(--card); border:1px solid var(--line);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  font-size:.85rem; position:relative;
}
.cal-day.empty{background:transparent; border-color:transparent;}
.cal-day.has-match{cursor:pointer; border-color:var(--accent); font-weight:700;}
.cal-day.has-match.trasferta-day{border-color:var(--away);}
.cal-day .dot{width:6px; height:6px; border-radius:999px; background:var(--home);}
.cal-day.trasferta-day .dot{background:var(--away);}
.cal-day .result-icon{font-size:.8rem; font-weight:800; line-height:1;}
.cal-day.esito-win{background:rgba(63,163,77,.18); border-color:var(--home);}
.cal-day.esito-win .result-icon{color:var(--home);}
.cal-day.esito-loss{background:rgba(192,57,43,.16); border-color:var(--danger);}
.cal-day.esito-loss .result-icon{color:var(--danger);}
.cal-day.multi-match{border-color:var(--ink);}
.cal-day .ind-row{display:flex; gap:4px; align-items:center; justify-content:center;}
.cal-day .ind-row .result-icon.won{color:var(--home);}
.cal-day .ind-row .result-icon.lost{color:var(--danger);}
.cal-day.today{outline:3px solid var(--ink); outline-offset:-2px; font-weight:800;}
.cal-day.today span:first-child{text-decoration:underline;}

.modal-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.5); display:none;
  align-items:flex-end; justify-content:center; z-index:50; padding:0;
}
.modal-overlay.open{display:flex;}
.modal-sheet{
  background:var(--bg); width:100%; max-width:640px; max-height:88vh; overflow-y:auto;
  border-radius:18px 18px 0 0; padding:16px 14px calc(env(safe-area-inset-bottom,0px) + 20px);
}
.modal-close{display:block; margin:0 0 10px auto; background:var(--line); color:var(--ink); padding:6px 12px;}

.filter-bar{display:flex; flex-direction:column; align-items:center; gap:8px; margin-top:12px;}
#season-select{
  font:inherit; font-weight:600; padding:6px 10px; border-radius:10px; border:1px solid var(--line);
  background:var(--card); color:var(--ink);
}
.camp-filter{display:flex; flex-wrap:wrap; justify-content:center; gap:6px;}
.camp-pill{
  font-size:.78rem; padding:5px 12px; border-radius:999px; border:1px solid var(--line);
  background:var(--card); color:var(--ink); cursor:pointer;
}
.camp-pill.active{border-color:transparent; color:#fff; font-weight:600;}
.camp-badge{
  display:inline-block; font-size:.68rem; font-weight:700; padding:2px 8px; border-radius:999px;
  color:#fff; margin-top:6px;
}
.share-btn{
  display:block; margin-top:10px; padding:9px 12px; text-align:center; text-decoration:none;
  background:rgba(63,163,77,.14); color:var(--home); font-weight:600; font-size:.85rem; border-radius:10px;
  border:1px solid rgba(63,163,77,.35);
}
.view-toggle{flex-wrap:wrap;}
.synth-summary{margin-bottom:12px;}
.synth-list{background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden;}
.synth-row{
  display:grid; grid-template-columns:1fr auto auto 22px; align-items:center; gap:8px;
  padding:10px 12px; border-bottom:1px solid var(--line); cursor:pointer;
}
.synth-row:last-child{border-bottom:none;}
.synth-row:active{background:var(--bg);}
.synth-main{display:flex; flex-direction:column; min-width:0;}
.synth-opp{font-weight:600; font-size:.9rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.synth-date{font-size:.7rem; color:var(--sub);}
.synth-ha{font-size:.75rem; color:var(--sub); white-space:nowrap;}
.synth-score{font-weight:800; min-width:34px; text-align:right;}
.synth-row.row-win .synth-score{color:var(--home);}
.synth-row.row-loss .synth-score{color:var(--danger);}

.install-banner{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  background:var(--card); border-bottom:1px solid var(--line); padding:10px 14px;
  font-size:.82rem;
}
.install-banner button{background:var(--accent); color:var(--accent-ink); font-weight:700; padding:6px 12px; font-size:.78rem;}
.install-banner .install-close{background:transparent; color:var(--sub); font-weight:400; padding:4px 8px;}
.export-btn{margin-top:10px; background:var(--line); color:var(--ink); font-size:.8rem; padding:6px 14px;}

.stats-filters{display:flex; justify-content:center; gap:8px; margin-bottom:14px; flex-wrap:wrap;}
.stats-filters select{
  font:inherit; font-weight:600; padding:6px 10px; border-radius:10px; border:1px solid var(--line);
  background:var(--card); color:var(--ink);
}
.stats-section{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px;}
.stats-section h3{margin:0 0 10px; font-size:1rem;}
.stat-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:8px;}
.stat-card{background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px; display:flex; flex-direction:column; align-items:center; gap:2px;}
.stat-card.win{border-color:var(--home);}
.stat-card.loss{border-color:var(--danger);}
.stat-num{font-size:1.25rem; font-weight:800;}
.stat-label{font-size:.72rem; color:var(--sub); text-align:center;}
.stat-bar-row{display:flex; align-items:center; gap:8px; margin:6px 0; font-size:.82rem;}
.stat-bar-label{flex:0 0 120px; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.stat-bar-track{flex:1; height:10px; background:var(--line); border-radius:999px; overflow:hidden;}
.stat-bar-fill{height:100%; background:var(--accent); border-radius:999px;}
.stat-bar-val{flex:0 0 40px; text-align:right; font-weight:700;}
.stats-table{width:100%; border-collapse:collapse; font-size:.82rem; margin-top:6px;}
.stats-table th, .stats-table td{padding:5px 6px; border-bottom:1px solid var(--line); text-align:center;}
.stats-table th{color:var(--sub); font-weight:600;}
.stats-table td:first-child, .stats-table th:first-child{text-align:left;}
.stats-table tr.critico{background:rgba(192,57,43,.08);}
.chart-title{font-size:.78rem; color:var(--sub); margin:10px 0 4px;}
.chart-wrap{overflow-x:auto; max-width:100%;}
.chart-svg{display:block; height:150px; min-width:100%;}
.ma-control{font-size:.8rem; color:var(--sub); text-align:center; margin-bottom:4px;}
.ma-control select{font:inherit; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--ink); padding:2px 6px;}
.h2h-item{border-bottom:1px solid var(--line);}
.h2h-item:last-child{border-bottom:none;}
.h2h-head{
  width:100%; background:transparent; color:var(--ink); display:flex; justify-content:space-between;
  padding:10px 2px; font-weight:600; text-align:left;
}
.h2h-record{color:var(--sub); font-weight:600;}
.h2h-history{padding:0 2px 10px;}
.h2h-row{display:flex; justify-content:space-between; gap:8px; font-size:.8rem; padding:4px 0; color:var(--sub);}
.h2h-row .won{color:var(--home); font-weight:700;}
.h2h-row .lost{color:var(--danger); font-weight:700;}
.h2h-sets{color:var(--sub); font-size:.75rem;}

<script>
const TEAM = "ASD GREEN VOLLEY";
let matches = []; // nessun dato incorporato: tutto arriva da data.json via /api/data
let writable = true; // ottimistico finché non arriva un rifiuto

const CAMP_COLORS = ['#3fa34d','#c98a2c','#3b6fc9','#a03bc9','#c93b5e','#3bb3a3'];
function campColor(nome){
  const lista = [...new Set(matches.map(m=>m.campionato))].sort();
  const idx = lista.indexOf(nome);
  return idx >= 0 ? CAMP_COLORS[idx % CAMP_COLORS.length] : CAMP_COLORS[0];
}

let selectedSeason = null;
let selectedCampionato = 'tutti';

function getSeasons(){
  return [...new Set(matches.map(m=>m.stagione))].sort().reverse();
}

function getCampionatiPerStagione(stagione){
  return [...new Set(matches.filter(m=>m.stagione===stagione).map(m=>m.campionato))].sort();
}

function initFilters(){
  const seasons = getSeasons();
  selectedSeason = seasons[0]; // l'ultimo anno caricato
  selectedCampionato = 'tutti';
  renderFilterBar();
}

function renderFilterBar(){
  const seasons = getSeasons();
  const select = document.getElementById('season-select');
  select.innerHTML = seasons.map(s=>`<option value="${escapeHtml(s)}" ${s===selectedSeason?'selected':''}>${escapeHtml(s)}</option>`).join('');
  const camps = getCampionatiPerStagione(selectedSeason);
  const campFilter = document.getElementById('camp-filter');
  let pills = `<button class="camp-pill ${selectedCampionato==='tutti'?'active':''}" style="${selectedCampionato==='tutti'?'background:var(--ink)':''}" onclick="onCampChange('tutti')">Tutti</button>`;
  pills += camps.map(c => {
    const active = selectedCampionato===c;
    return `<button class="camp-pill ${active?'active':''}" style="${active?`background:${campColor(c)}`:''}" onclick="onCampChange('${c.replace(/'/g,"\\'")}')">${escapeHtml(c)}</button>`;
  }).join('');
  campFilter.innerHTML = pills;
}

function onCampChange(v){

function filteredMatches(){

function todayLocalIso(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function fmtData(iso){
  const d = new Date(iso+"T00:00:00");
  const giorni=["Dom","Lun","Mar","Mer","Gio","Ven","Sab"];
  const mesi=["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
  return `${giorni[d.getDay()]} ${d.getDate()} ${mesi[d.getMonth()]} ${d.getFullYear()}`;
}

function nextMatchN(){
  const today = todayLocalIso();
  const upcoming = filteredMatches().filter(m=>m.data>=today).sort((a,b)=>a.data.localeCompare(b.data));
  return upcoming.length ? upcoming[0].n : null;
}

function addNotifica(entry){

/* ===== Banner scorrevole ===== */
function nextMatchGlobal(){
  const today = todayLocalIso();
  const upcoming = matches.filter(m=>m.data>=today).sort((a,b)=>(a.data+a.ora).localeCompare(b.data+b.ora));
  return upcoming[0] || null;
}

function lastPlayedGlobal(){
  const played = matches.filter(m=>m.risultato).sort((a,b)=>(b.data+b.ora).localeCompare(a.data+a.ora));
  return played[0] || null;
}

function buildTickerSegments(){
  const segs = [];

  const next = nextMatchGlobal();
  if(next){
    const isHome = next.casa===TEAM;
    const opp = isHome ? next.trasferta : next.casa;
    segs.push(`⏭️ Prossima: vs ${escapeHtml(opp)} — ${fmtData(next.data)} ore ${next.ora} @ ${escapeHtml(next.impianto)}`);
  }

  const last = lastPlayedGlobal();
  if(last){
    const isHome = last.casa===TEAM;
    const opp = isHome ? last.trasferta : last.casa;
    const esitoTxt = last.risultato.esito==='V' ? 'Vittoria' : 'Sconfitta';
    segs.push(`🏐 Ultima: vs ${escapeHtml(opp)} — ${esitoTxt} ${escapeHtml(last.risultato.score)}`);
  }

  if(selectedSeason){
    const badgePool = matches
      .filter(m=> m.stagione===selectedSeason && (selectedCampionato==='tutti' || m.campionato===selectedCampionato) && m.risultato)
      .sort((a,b)=>(a.data+a.ora).localeCompare(b.data+b.ora));
    computeBadges(badgePool).forEach(b=>{
      segs.push(`${b.icon} ${b.titolo}: ${b.valore}${b.dettaglio ? ' — '+b.dettaglio : ''}`);
    });
  }

  segs.push('🏐 Presenti comunque e dovunque — Curva budini molli');
  return segs;
}

function updateTicker(){
  const track = document.getElementById('ticker-track');
  if(!track) return;
  const text = buildTickerSegments().join('&nbsp;&nbsp;&nbsp;•&nbsp;&nbsp;&nbsp;');
  track.innerHTML = `<span>${text}</span><span>${text}</span>`;
  requestAnimationFrame(()=>{
    const oneCopyWidth = track.scrollWidth / 2;
    const pxPerSecond = 55; // velocità costante, indipendente da quanto testo c'è
    track.style.animationDuration = Math.max(10, oneCopyWidth / pxPerSecond) + 's';
  });
}

/* ===== Meteo (Open-Meteo, gratuito e senza chiave API) ===== */
const weatherCache = {}; // "citta|prov|data" -> dati meteo o {error:true}
const geoCache = {};     // "citta|prov" -> {lat, lon}

function addDaysIso(iso, days){
  const d = new Date(iso+"T00:00:00");
  d.setDate(d.getDate()+days);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function needsWeather(m){
  const today = todayLocalIso();
  return m.data >= today && m.data <= addDaysIso(today, 15);
}

function weatherCodeToIcon(code){
  const map = {
    0:['☀️','Sereno'], 1:['🌤️','Poco nuvoloso'], 2:['⛅','Parzialmente nuvoloso'], 3:['☁️','Coperto'],
    45:['🌫️','Nebbia'], 48:['🌫️','Nebbia con brina'],
    51:['🌦️','Pioviggine leggera'], 53:['🌦️','Pioviggine'], 55:['🌦️','Pioviggine intensa'],
    56:['🌧️','Pioviggine gelata'], 57:['🌧️','Pioviggine gelata intensa'],
    61:['🌧️','Pioggia debole'], 63:['🌧️','Pioggia'], 65:['🌧️','Pioggia intensa'],
    66:['🌧️','Pioggia gelata'], 67:['🌧️','Pioggia gelata intensa'],
    71:['❄️','Neve debole'], 73:['❄️','Neve'], 75:['❄️','Neve intensa'], 77:['❄️','Granelli di neve'],
    80:['🌦️','Rovesci deboli'], 81:['🌧️','Rovesci'], 82:['⛈️','Rovesci forti'],
    85:['❄️','Rovesci di neve'], 86:['❄️','Rovesci di neve intensi'],
    95:['⛈️','Temporale'], 96:['⛈️','Temporale con grandine'], 99:['⛈️','Temporale forte con grandine']
  };
  const [icon, label] = map[code] || ['❔','Non disponibile'];
  return { icon, label };
}

async function fetchWeatherForMatch(m){
  const key = `${m.citta}|${m.prov}|${m.data}`;
  if(weatherCache[key]) return weatherCache[key];
  try{
    const geoKey = `${m.citta}|${m.prov}`;
    let coords = geoCache[geoKey];
    if(!coords){
      const gRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(m.citta)}&count=5&language=it&country=IT`);
      const gData = await gRes.json();
      let best = gData.results && gData.results[0];
      if(gData.results && gData.results.length>1){
        const migliore = gData.results.find(r => `${r.admin2||''} ${r.admin3||''}`.toUpperCase().includes(m.prov));
        if(migliore) best = migliore;
      }
      if(!best) throw new Error('località non trovata');
      coords = { lat: best.latitude, lon: best.longitude };
      geoCache[geoKey] = coords;
    }
    const fRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${coords.lat}&longitude=${coords.lon}&daily=weathercode,temperature_2m_max,temperature_2m_min,windspeed_10m_max,precipitation_probability_max,precipitation_sum&timezone=Europe%2FRome&start_date=${m.data}&end_date=${m.data}`);
    const fData = await fRes.json();
    if(!fData.daily || !fData.daily.time || fData.daily.time.length===0) throw new Error('previsione non disponibile');
    const info = {
      code: fData.daily.weathercode[0],
      tempMax: fData.daily.temperature_2m_max[0],
      tempMin: fData.daily.temperature_2m_min[0],
      wind: fData.daily.windspeed_10m_max[0],
      precipProb: fData.daily.precipitation_probability_max ? fData.daily.precipitation_probability_max[0] : null,
      precipSum: fData.daily.precipitation_sum[0]
    };
    weatherCache[key] = { ...info, ...weatherCodeToIcon(info.code) };
  }catch(e){
    weatherCache[key] = { error:true, icon:'❔', label:'Meteo non disponibile' };
  }
  return weatherCache[key];
}

function weatherButtonHtml(m){
  if(!needsWeather(m)) return '';
  const key = `${m.citta}|${m.prov}|${m.data}`;
  const w = weatherCache[key];
  if(!w) return `<button class="weather-btn" id="weather-${m.n}" title="Caricamento meteo…">⏳</button>`;
  if(w.error) return `<button class="weather-btn" id="weather-${m.n}" title="${escapeHtml(w.label)}">❔</button>`;
  return `<button class="weather-btn" id="weather-${m.n}" onclick="openWeatherModal('${m.n}')" title="${escapeHtml(w.label)}">${w.icon} ${Math.round(w.tempMax)}°</button>`;
}

function loadWeatherForUpcoming(){
  matches.filter(needsWeather).forEach(m=>{
    const key = `${m.citta}|${m.prov}|${m.data}`;
    if(weatherCache[key]) return;
    fetchWeatherForMatch(m).then(()=>{
      const el = document.getElementById('weather-'+m.n);
      if(el) el.outerHTML = weatherButtonHtml(m);
    });
  });
}

function openWeatherModal(n){
  const m = matches.find(x=>x.n===n);
  if(!m) return;
  const key = `${m.citta}|${m.prov}|${m.data}`;
  const w = weatherCache[key];

    <p class="chart-title" style="margin-top:0">Meteo previsto — ${fmtData(m.data)}</p>
    <div class="weather-detail">
      <div class="weather-icon-big">${w.icon}</div>
      <div class="weather-label">${escapeHtml(w.label)}</div>
      <div class="readonly-note" style="margin:4px 0 0">${escapeHtml(m.citta)} (${m.prov})</div>
    </div>
    <table class="stats-table">
      <tr><td>Temperatura massima</td><td>${Math.round(w.tempMax)}°C</td></tr>
      <tr><td>Temperatura minima</td><td>${Math.round(w.tempMin)}°C</td></tr>
      <tr><td>Vento massimo</td><td>${Math.round(w.wind)} km/h</td></tr>
      ${w.precipProb!=null ? `<tr><td>Probabilità di pioggia</td><td>${w.precipProb}%</td></tr>` : ''}
      <tr><td>Precipitazioni previste</td><td>${w.precipSum} mm</td></tr>
    </table>
    <p class="readonly-note">Fonte: Open-Meteo — previsione, può cambiare avvicinandosi alla data</p>`;
  document.getElementById('modal-sheet').innerHTML =
    `<button class="modal-close" onclick="closeModal()">Chiudi ✕</button>` + html;
  document.getElementById('modal-overlay').classList.add('open');
}

function updateClassificaLabel(){

function render(){
  if(view === 'calendario'){
    renderCalendar();
  } else if(view === 'statistiche'){
    renderStats();
  } else if(view === 'sintetica'){
    renderSynth();
  } else {
    renderList();
  }
  updateTicker();
  loadWeatherForUpcoming();
  updateClassificaLabel();
}

function renderList(){
  const main = document.getElementById('main');
  const nextN = nextMatchN();
  const sorted = [...filteredMatches()].sort((a,b)=> (a.data+a.ora).localeCompare(b.data+b.ora));
  let html = '';
  if(!writable){
    html += `<p class="readonly-note">Sola lettura: i risultati li può aggiornare chi ha accesso in modifica al link.</p>`;
  }
  if(sorted.length === 0){
    html += `<p class="readonly-note">Nessuna partita per questa selezione.</p>`;
  }
  for(const m of sorted){
    html += matchCardHtml(m, m.n === nextN);
  }
  main.innerHTML = html;
}

function renderCalendar(){
  const main = document.getElementById('main');
  const mesi=["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"];
  const dow=["Lun","Mar","Mer","Gio","Ven","Sab","Dom"];
  const first = new Date(calYear, calMonth, 1);
  const startOffset = (first.getDay() + 6) % 7; // lunedì=0
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const todayIso = todayLocalIso();

  const byDate = {};
  for(const m of filteredMatches()){
    (byDate[m.data] = byDate[m.data] || []).push(m);
  }

  let cells = '';
  for(let i=0;i<startOffset;i++) cells += `<div class="cal-day empty"></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const iso = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const dayMatches = byDate[iso];
    let cls = 'cal-day';
    let onclick = '';
    let indicator = '';
    if(dayMatches && dayMatches.length){
      cls += ' has-match';
      onclick = ` onclick="onDayClick('${iso}')"`;
      if(dayMatches.length === 1){
        const m0 = dayMatches[0];
        if(m0.casa !== TEAM) cls += ' trasferta-day';
        const r = m0.risultato;
        if(r){
          cls += r.esito === 'V' ? ' esito-win' : ' esito-loss';
          indicator = `<span class="result-icon">${r.esito === 'V' ? '✓' : '✗'}</span>`;
        } else {
          indicator = `<span class="dot" style="background:${campColor(m0.campionato)}"></span>`;
        }
      } else {
        cls += ' multi-match';
        indicator = `<span class="ind-row">` + dayMatches.map(m=>{
          const r = m.risultato;
          if(r) return `<span class="result-icon ${r.esito==='V'?'won':'lost'}">${r.esito==='V'?'✓':'✗'}</span>`;
          return `<span class="dot" style="background:${campColor(m.campionato)}"></span>`;
        }).join('') + `</span>`;
      }
    }
    if(iso === todayIso) cls += ' today';
    cells += `<div class="${cls}"${onclick}><span>${day}</span>${indicator}</div>`;
  }

  let html = `
    <div class="cal-nav">
      <button onclick="jumpToMonthWithMatches(-1)" title="Mese precedente con partite">«</button>
      <button onclick="changeMonth(-1)">‹</button>
      <div class="cal-nav-center">
        <h2>${mesi[calMonth]} ${calYear}</h2>
        <button class="btn-today" onclick="goToday()">Oggi</button>
      </div>
      <button onclick="changeMonth(1)">›</button>
      <button onclick="jumpToMonthWithMatches(1)" title="Mese successivo con partite">»</button>
    </div>
    <div class="cal-grid">
      ${dow.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells}
    </div>
    <p class="readonly-note" style="margin-top:12px;">✓ vinta · ✗ persa · pallino colorato = campionato, partita ancora da giocare</p>`;
  main.innerHTML = html;
}

function onDayClick(iso){
  const list = filteredMatches().filter(m=>m.data===iso).sort((a,b)=>a.ora.localeCompare(b.ora));
  if(list.length === 1){ openModal(list[0].n); return; }
  if(list.length === 0) return;
  const righe = list.map(m=>{
    const isHome = m.casa === TEAM;
    const opp = isHome ? m.trasferta : m.casa;
    const r = m.risultato;
    const icon = r ? (r.esito==='V' ? '<span class="set-icon won">✓</span>' : '<span class="set-icon lost">✗</span>') : '<span class="set-icon"></span>';
    return `<div class="synth-row ${r ? (r.esito==='V'?'row-win':'row-loss') : ''}" onclick="openModal('${m.n}')">
      <div class="synth-main">
        <span class="synth-opp">${escapeHtml(opp)}</span>
        <span class="synth-date">${escapeHtml(m.campionato)} · ore ${m.ora}</span>
      </div>
      <span class="synth-ha">${isHome ? '🏠 Casa' : '🚌 Trasf.'}</span>
      <span class="synth-score">${r ? escapeHtml(r.score) : ''}</span>
      ${icon}
    </div>`;
  }).join('');
  document.getElementById('modal-sheet').innerHTML =
    `<button class="modal-close" onclick="closeModal()">Chiudi ✕</button>` +
    `<p class="chart-title" style="margin-top:0">${fmtDataLunga(iso)} — ${list.length} partite, scegli quale aprire</p>` +
    `<div class="synth-list">${righe}</div>`;
  document.getElementById('modal-overlay').classList.add('open');
}

function goToday(){
  initCalPosition();

function changeMonth(delta){
  calMonth += delta;
  if(calMonth < 0){ calMonth = 11; calYear--; }
  if(calMonth > 11){ calMonth = 0; calYear++; }
  renderCalendar();
}

function jumpToMonthWithMatches(direction){
  const pool = filteredMatches();
  if(pool.length === 0) return;
  const monthsWithMatches = new Set(pool.map(m => m.data.slice(0,7))); // "YYYY-MM"
  let month = calMonth, year = calYear;
  for(let i=0; i<240; i++){ // limite di sicurezza: 20 anni
    month += direction;
    if(month < 0){ month = 11; year--; }
    if(month > 11){ month = 0; year++; }
    const key = `${year}-${String(month+1).padStart(2,'0')}`;
    if(monthsWithMatches.has(key)){
      calMonth = month; calYear = year;
      renderCalendar();
      return;
    }
  }
}

    if(input && input.trim()){

  }

}

function currentVoterVote(m){
  const name = localStorage.getItem('gv_voter_name');
  if(!name || !m.voti) return null;
  return m.voti[name] || null;
}

async function vote(n, type){
  const name = getVoterName();
  if(!name) return;
  const m = matches.find(x=>x.n===n);
  if(!m.voti) m.voti = {};
  if(m.voti[name] === type){
    delete m.voti[name];
  } else {
    m.voti[name] = type;
    const opp = m.casa===TEAM ? m.trasferta : m.casa;
    addNotifica({ tipo: type, nome: name, opponent: opp });
  }
  render();
  refreshIfModal(n);
  await persist();
}

function updateFormLive(n){
  let totGv = 0, totOpp = 0, setsGv = 0, setsOpp = 0, anyComplete = false;
  for(let i=1;i<=5;i++){
    const gvEl = document.getElementById(`s${i}gv-${n}`);
    const oppEl = document.getElementById(`s${i}opp-${n}`);
    const iconEl = document.getElementById(`icon${i}-${n}`);
    if(!gvEl || !oppEl || !iconEl) continue;
    const gvVal = gvEl.value, oppVal = oppEl.value;
    if(gvVal !== '' && oppVal !== ''){
      const gv = parseInt(gvVal,10), opp = parseInt(oppVal,10);
      totGv += gv; totOpp += opp;
      const won = gv > opp;
      if(won) setsGv++; else if(opp > gv) setsOpp++;
      iconEl.textContent = gv === opp ? '' : (won ? '✓' : '✗');
      iconEl.className = 'set-icon ' + (gv === opp ? '' : (won ? 'won' : 'lost'));
      anyComplete = true;
    } else {
      iconEl.textContent = '';
      iconEl.className = 'set-icon';
    }
  }
  const totGvEl = document.getElementById(`totgv-${n}`);
  const totOppEl = document.getElementById(`totopp-${n}`);
  if(totGvEl) totGvEl.textContent = totGv;
  if(totOppEl) totOppEl.textContent = totOpp;
  const banner = document.getElementById(`banner-${n}`);
  if(!banner) return;
  if(!anyComplete){
    banner.textContent = '';
    banner.className = 'esito-banner';
  } else if(setsGv >= 3){
    banner.textContent = `Vittoria Green Volley (${setsGv}-${setsOpp})`;
    banner.className = 'esito-banner win';
  } else if(setsOpp >= 3){
    banner.textContent = `Sconfitta Green Volley (${setsGv}-${setsOpp})`;
    banner.className = 'esito-banner loss';
  } else if(setsGv === setsOpp){
    banner.textContent = `Parità set (${setsGv}-${setsOpp}) — partita in corso`;
    banner.className = 'esito-banner draw';
  } else if(setsGv > setsOpp){
    banner.textContent = `In vantaggio Green Volley (${setsGv}-${setsOpp})`;
    banner.className = 'esito-banner win';
  } else {
    banner.textContent = `In svantaggio Green Volley (${setsGv}-${setsOpp})`;
    banner.className = 'esito-banner loss';
  }
}

async function saveResult(ev, n){

  const sets = [];

    const gvVal = document.getElementById(`s${i}gv-${n}`).value;
    const oppVal = document.getElementById(`s${i}opp-${n}`).value;
    if(gvVal === '' && oppVal === '') continue;
    if(gvVal === '' || oppVal === ''){
      showStatus(`Compila entrambi i punteggi del Set ${i}`);
      return false;
    }
    sets.push({ gv: parseInt(gvVal,10), opp: parseInt(oppVal,10) });
  }
  if(sets.length === 0){
    showStatus('Inserisci almeno un set');
    return false;
  }
  let setsGv = 0, setsOpp = 0;
  for(const s of sets){ if(s.gv > s.opp) setsGv++; else if(s.opp > s.gv) setsOpp++; }
  const m = matches.find(x=>x.n===n);
  m.risultato = {
    sets,
    score: `${setsGv}-${setsOpp}`,
    esito: setsGv >= 3 ? 'V' : (setsOpp >= 3 ? 'P' : (setsGv > setsOpp ? 'V' : 'P')),
    note: sets.map(s=>`${s.gv}-${s.opp}`).join(', ')
  };
  {
    const opp = m.casa===TEAM ? m.trasferta : m.casa;
    addNotifica({ tipo: 'risultato', opponent: opp, esito: m.risultato.esito, score: m.risultato.score });
  }
  openForms.delete(n);
  render();
  refreshIfModal(n);
  await persist();
  return false;
}

// ===== DATI CONDIVISI TRAMITE /api/data (Vercel + GitHub) =====
// L'endpoint /api/data.js legge e scrive data.json nel repo GitHub via Octokit.
// Usiamo un percorso relativo: funziona automaticamente sul dominio Vercel
// a cui è collegato questo stesso progetto, niente da configurare qui.
const API_URL = '/api/data';
let currentSha = null; // "sha" del file data.json su GitHub, serve per evitare sovrascritture

async function loadFromApi(showMsg){
  try{
    const res = await fetch(API_URL);
    if(!res.ok) throw new Error('http '+res.status);
    const payload = await res.json();
    if(Array.isArray(payload.data)){
      // formato precedente: data.json era un array di partite puro
      matches = payload.data;
      notifiche = [];
    } else if(payload.data && Array.isArray(payload.data.matches)){
      matches = payload.data.matches;
      notifiche = Array.isArray(payload.data.notifiche) ? payload.data.notifiche : [];
    } else {
      throw new Error('formato dati inatteso');
    }
    currentSha = payload.sha;
    render();
    if(showMsg) showStatus('Dati aggiornati');
    return true;
  }catch(e){
    if(showMsg) showStatus('Impossibile aggiornare i dati, riprova');
    return false;
  }
}

async function persist(){
  try{
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ newData: { matches, notifiche }, sha: currentSha })
    });
    const payload = await res.json().catch(()=>({}));
    if(!res.ok){
      // Probabile conflitto: un altro utente ha salvato nel frattempo (sha non più valido).
      // Ricarichiamo i dati più recenti; la modifica andrà reinserita.
      await loadFromApi(false);
      showStatus('Qualcun altro ha salvato nel frattempo: dati aggiornati, riprova a inserire');
      return;
    }
    currentSha = payload.sha;
    showStatus('Risultato salvato per tutti');
  }catch(e){
    showStatus('Salvataggio non riuscito, riprova');
  }
}

/* ===== STATISTICHE ===== */
let statSeason = 'tutte';
let statCampionato = 'tutti';
let maWindow = 5;
let expandedOpponent = null;

function pct(a,b){ return b ? Math.round(a/b*1000)/10 : 0; }

function rollingAvg(arr, w){
  return arr.map((_,i)=>{
    const start = Math.max(0, i-w+1);
    const slice = arr.slice(start, i+1);
    return slice.reduce((a,b)=>a+b,0) / slice.length;
  });
}

function chartSvg(seriesList, labels, opts={}){
  const w = Math.max(320, labels.length*36);
  const h = opts.height || 150;
  const padL=26, padR=8, padT=10, padB=18;
  const innerW=w-padL-padR, innerH=h-padT-padB;
  let allVals=[];
  seriesList.forEach(s=>{ allVals=allVals.concat(s.values.filter(v=>v!=null && !isNaN(v))); });
  let min = opts.min!=null ? opts.min : Math.min(0,...allVals,0);
  let max = opts.max!=null ? opts.max : Math.max(...allVals,1);
  if(max===min) max = min+1;
  const xStep = labels.length>1 ? innerW/(labels.length-1) : 0;
  const xPos = i => padL + (labels.length>1 ? i*xStep : innerW/2);
  const yPos = v => padT + innerH - ((v-min)/(max-min))*innerH;
  let svg = `<svg viewBox="0 0 ${w} ${h}" class="chart-svg" preserveAspectRatio="xMinYMin meet">`;
  if(min<0 && max>0){
    const y0=yPos(0);
    svg += `<line x1="${padL}" y1="${y0}" x2="${w-padR}" y2="${y0}" stroke="var(--line)" stroke-dasharray="2,2"/>`;
  }
  seriesList.forEach(s=>{
    const pts = s.values.map((v,i)=> (v==null||isNaN(v)) ? null : [xPos(i), yPos(v)]);
    if(s.type==='bar'){
      const bw = Math.min(16, xStep*0.55) || 10;
      const y0=yPos(Math.max(min,0));
      pts.forEach(p=>{ if(!p) return; svg += `<rect x="${p[0]-bw/2}" y="${Math.min(p[1],y0)}" width="${bw}" height="${Math.max(1,Math.abs(p[1]-y0))}" fill="${s.color}" rx="2"/>`; });
    } else {
      const valid = pts.map((p,i)=>[p,i]).filter(([p])=>p);
      const path = valid.map(([p],idx)=> (idx===0?'M':'L')+p[0]+','+p[1]).join(' ');
      svg += `<path d="${path}" fill="none" stroke="${s.color}" stroke-width="2"${s.dashed?' stroke-dasharray="5,4"':''}/>`;
      if(s.dots!==false) valid.forEach(([p])=>{ svg += `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${s.color}"/>`; });
    }
  });
  const step = Math.max(1, Math.ceil(labels.length/8));
  labels.forEach((l,i)=>{ if(i%step===0 || i===labels.length-1) svg += `<text x="${xPos(i)}" y="${h-4}" font-size="8" fill="var(--sub)" text-anchor="middle">${l}</text>`; });
  svg += '</svg>';
  return `<div class="chart-wrap">${svg}</div>`;
}

function statBar(label, percent, color){
  return `<div class="stat-bar-row">
    <span class="stat-bar-label">${escapeHtml(label)}</span>
    <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${percent}%;background:${color||'var(--accent)'}"></div></div>
    <span class="stat-bar-val">${percent}%</span>

}

function matchPoints(m){
  return m.risultato.sets.reduce((acc,s)=>{ acc.gv+=s.gv; acc.opp+=s.opp; return acc; }, {gv:0,opp:0});
}

function statsPool(){
  return matches.filter(m =>
    (statSeason==='tutte' || m.stagione===statSeason) &&
    (statCampionato==='tutti' || m.campionato===statCampionato) &&
    m.risultato
  ).sort((a,b)=>(a.data+a.ora).localeCompare(b.data+b.ora));
}

function onStatSeasonChange(v){ statSeason=v; expandedOpponent=null; renderStats(); }
function onStatCampChange(v){ statCampionato=v; expandedOpponent=null; renderStats(); }

function badgeCard(b){

function computeBadges(pool){
  const opponentOf = m => m.casa===TEAM ? m.trasferta : m.casa;
  const badges = [];

  // Striscia di vittorie più lunga + striscia attuale
  let best = {len:0, endIdx:-1}, cur = 0;
  pool.forEach((m,i)=>{
    if(m.risultato.esito==='V'){ cur++; if(cur>best.len) best={len:cur, endIdx:i}; }
    else cur = 0;
  });
  if(best.len>0){
    const startM = pool[best.endIdx-best.len+1], endM = pool[best.endIdx];
    badges.push({icon:'🔥', titolo:'Striscia di vittorie più lunga', valore:`${best.len} partite`,
      dettaglio:`${fmtData(startM.data)} → ${fmtData(endM.data)}`});
  }
  let curStreak = 0, curType = null;
  for(let i=pool.length-1;i>=0;i--){
    const esito = pool[i].risultato.esito;
    if(curType===null) curType = esito;
    if(esito===curType) curStreak++; else break;
  }
  if(curStreak>0){
    badges.push({icon:curType==='V'?'⚡':'🥶', titolo:curType==='V'?'Striscia vittorie in corso':'Striscia sconfitte in corso',
      valore:`${curStreak} partite`, dettaglio:`ultima: ${fmtData(pool[pool.length-1].data)}`});
  }

  // Miglior rimonta: partita vinta dopo aver perso i primi set
  let bestComeback = null;
  pool.filter(m=>m.risultato.esito==='V').forEach(m=>{
    let lost=0;
    for(const s of m.risultato.sets){ if(s.gv<s.opp) lost++; else break; }
    if(lost>0 && (!bestComeback || lost>bestComeback.lost)) bestComeback = {m, lost};
  });
  if(bestComeback){
    badges.push({icon:'💪', titolo:'Miglior rimonta', valore:`Sotto di ${bestComeback.lost} set`,
      dettaglio:`vs ${escapeHtml(opponentOf(bestComeback.m))} · ${bestComeback.m.risultato.score} · ${fmtData(bestComeback.m.data)}`});
  }

  // Prima vittoria netta (senza perdere set)
  const primoPulito = pool.find(m=> m.risultato.esito==='V' && m.risultato.sets.every(s=>s.gv>s.opp));
  if(primoPulito){
    badges.push({icon:'🧹', titolo:'Prima vittoria netta', valore:escapeHtml(primoPulito.risultato.score),
      dettaglio:`vs ${escapeHtml(opponentOf(primoPulito))} · ${fmtData(primoPulito.data)}`});
  }

  // Punteggio più netto (maggior scarto punti in una vittoria)
  let bestMargin = null;
  pool.filter(m=>m.risultato.esito==='V').forEach(m=>{
    const p = matchPoints(m); const diff = p.gv - p.opp;
    if(!bestMargin || diff>bestMargin.diff) bestMargin = {m, diff, p};
  });
  if(bestMargin){
    badges.push({icon:'🎯', titolo:'Vittoria più netta a punti', valore:`+${bestMargin.diff} punti`,
      dettaglio:`vs ${escapeHtml(opponentOf(bestMargin.m))} · ${bestMargin.p.gv}-${bestMargin.p.opp} · ${fmtData(bestMargin.m.data)}`});
  }

  // Set decisivo più combattuto (ultimo set giocato in ogni partita, margine minimo)
  let tightest = null;
  pool.forEach(m=>{
    const last = m.risultato.sets[m.risultato.sets.length-1];
    if(!last) return;
    const margin = Math.abs(last.gv-last.opp);
    if(!tightest || margin<tightest.margin) tightest = {m, last, margin};
  });
  if(tightest){
    badges.push({icon:'😤', titolo:'Ultimo set più combattuto', valore:`${tightest.last.gv}-${tightest.last.opp}`,
      dettaglio:`vs ${escapeHtml(opponentOf(tightest.m))} · ${tightest.m.risultato.esito==='V'?'vinta':'persa'} · ${fmtData(tightest.m.data)}`});
  }

  // Avversario battuto più spesso
  const byOpp = {};
  pool.forEach(m=>{ const o=opponentOf(m); (byOpp[o]=byOpp[o]||{w:0,n:0}); byOpp[o].n++; if(m.risultato.esito==='V') byOpp[o].w++; });
  let favOpp = null;
  Object.keys(byOpp).forEach(o=>{ if(!favOpp || byOpp[o].w>byOpp[favOpp].w) favOpp = o; });
  if(favOpp && byOpp[favOpp].w>0){
    badges.push({icon:'🏆', titolo:'Avversario battuto più spesso', valore:escapeHtml(favOpp),
      dettaglio:`${byOpp[favOpp].w} vittorie su ${byOpp[favOpp].n} sfide`});
  }

  return badges;
}

function renderStatsBadges(pool){
  const badges = computeBadges(pool);
  if(badges.length===0) return '';
  return `<div class="stats-section">
    <h3>Badge e record</h3>
    <div class="badge-grid">${badges.map(badgeCard).join('')}</div>
  </div>`;
}

function renderStatsTrend(pool){
  const labels = pool.map(m=>{ const d=new Date(m.data+"T00:00:00"); return d.getDate()+'/'+(d.getMonth()+1); });
  const esiti = pool.map(m=>m.risultato.esito==='V'?1:0);
  const winMa = rollingAvg(esiti, maWindow);
  const puntiF = pool.map(m=>matchPoints(m).gv);
  const puntiS = pool.map(m=>matchPoints(m).opp);
  const diff = pool.map((_,i)=>puntiF[i]-puntiS[i]);
  const diffMa = rollingAvg(diff, maWindow);
  const setsVinti = pool.map(m=>m.risultato.sets.filter(s=>s.gv>s.opp).length);
  const setsMa = rollingAvg(setsVinti, maWindow);
  return `<div class="stats-section">
    <h3>Andamento nel tempo</h3>
    <div class="ma-control">Media mobile su
      <select onchange="onMaChange(this.value)">${[3,5,10].map(v=>`<option value="${v}" ${v===maWindow?'selected':''}>${v} partite</option>`).join('')}</select>
    </div>
    <p class="chart-title">Esito partite (1=vittoria) e % vittorie mobile</p>
    ${chartSvg([{values:esiti,color:'var(--home)',type:'line'},{values:winMa,color:'#3b6fc9',dashed:true,dots:false}], labels, {min:0,max:1})}
    <p class="chart-title">Punti fatti (verde) vs subiti (rosso) per partita</p>
    ${chartSvg([{values:puntiF,color:'var(--home)'},{values:puntiS,color:'var(--danger)'}], labels)}
    <p class="chart-title">Differenza punti e media mobile</p>
    ${chartSvg([{values:diff,color:'var(--sub)',type:'bar'},{values:diffMa,color:'#3b6fc9',dashed:true,dots:false}], labels)}
    <p class="chart-title">Set vinti a partita e media mobile</p>
    ${chartSvg([{values:setsVinti,color:'var(--home)',type:'bar'},{values:setsMa,color:'#3b6fc9',dashed:true,dots:false}], labels, {min:0,max:5})}
  </div>`;
}

function renderStatsHomeAway(pool){
  const casa = pool.filter(m=>m.casa===TEAM);
  const trasf = pool.filter(m=>m.trasferta===TEAM);
  const wCasa = casa.filter(m=>m.risultato.esito==='V').length;
  const wTrasf = trasf.filter(m=>m.risultato.esito==='V').length;
  const avg=(arr,f)=> arr.length ? (arr.reduce((a,m)=>a+f(m),0)/arr.length).toFixed(1) : '–';
  return `<div class="stats-section">
    <h3>Casa vs Trasferta</h3>
    ${statBar('🏠 Casa ('+casa.length+')', pct(wCasa,casa.length), 'var(--home)')}
    ${statBar('🚌 Trasferta ('+trasf.length+')', pct(wTrasf,trasf.length), 'var(--away)')}
    <table class="stats-table">
      <tr><th></th><th>🏠 Casa</th><th>🚌 Trasferta</th></tr>
      <tr><td>Punti fatti medi</td><td>${avg(casa,m=>matchPoints(m).gv)}</td><td>${avg(trasf,m=>matchPoints(m).gv)}</td></tr>
      <tr><td>Punti subiti medi</td><td>${avg(casa,m=>matchPoints(m).opp)}</td><td>${avg(trasf,m=>matchPoints(m).opp)}</td></tr>
      <tr><td>Set vinti medi</td><td>${avg(casa,m=>m.risultato.sets.filter(s=>s.gv>s.opp).length)}</td><td>${avg(trasf,m=>m.risultato.sets.filter(s=>s.gv>s.opp).length)}</td></tr>
    </table>
  </div>`;
}

function renderStatsBySet(pool){
  const perSet = [1,2,3,4,5].map(i=>{
    let w=0,l=0,sumGv=0,sumOpp=0,n=0;
    pool.forEach(m=>{ const s=m.risultato.sets[i-1]; if(s){ n++; sumGv+=s.gv; sumOpp+=s.opp; if(s.gv>s.opp) w++; else l++; } });
    return {i,w,l,n, avgGv:n?(sumGv/n).toFixed(1):'–', avgOpp:n?(sumOpp/n).toFixed(1):'–', ratio:(w+l)?w/(w+l):null};
  });
  const tieBreak = perSet[4];
  const withSample = perSet.filter(s=>s.ratio!=null);
  const critico = withSample.length ? withSample.reduce((a,b)=> b.ratio<a.ratio?b:a) : null;
  return `<div class="stats-section">
    <h3>Analisi per set</h3>
    <table class="stats-table">
      <tr><th>Set</th><th>Vinti</th><th>Persi</th><th>Media fatti</th><th>Media subiti</th></tr>
      ${perSet.map(s=>`<tr class="${critico && s.i===critico.i?'critico':''}"><td>${s.i}°${critico && s.i===critico.i?' ⚠️':''}</td><td>${s.w}</td><td>${s.l}</td><td>${s.avgGv}</td><td>${s.avgOpp}</td></tr>`).join('')}
    </table>
    ${critico ? `<p class="readonly-note">Set più critico: <b>${critico.i}°</b> (vinto il ${Math.round(critico.ratio*100)}% delle volte)</p>` : ''}
    <p class="readonly-note">Partite al tie-break (5° set): ${tieBreak.n} — bilancio ${tieBreak.w}V-${tieBreak.l}P</p>
  </div>`;
}

function renderStatsScoreDist(pool){
  const counts = {};
  pool.forEach(m=>{
    const key = m.risultato.score;
    (counts[key] = counts[key] || {n:0, esito:m.risultato.esito}).n++;
  });
  const entries = Object.keys(counts).map(k=>({score:k, n:counts[k].n, esito:counts[k].esito}));
  const vittorie = entries.filter(e=>e.esito==='V').sort((a,b)=>{
    const aOpp = Number(a.score.split('-')[1]), bOpp = Number(b.score.split('-')[1]);
    return aOpp - bOpp;
  });
  const sconfitte = entries.filter(e=>e.esito==='P').sort((a,b)=>{
    const aGv = Number(a.score.split('-')[0]), bGv = Number(b.score.split('-')[0]);
    return bGv - aGv;
  });
  const totV = vittorie.reduce((s,e)=>s+e.n,0);
  const totP = sconfitte.reduce((s,e)=>s+e.n,0);
  const row = e => `<tr><td>${escapeHtml(e.score)}</td><td>${e.n}</td><td>${pct(e.n, e.esito==='V'?totV:totP)}%</td></tr>`;
  return `<div class="stats-section">
    <h3>Distribuzione punteggi finali</h3>
    <table class="stats-table">
      <tr><th>Risultato</th><th>Partite</th><th>% su vittorie/sconfitte</th></tr>
      ${vittorie.map(row).join('')}
      ${sconfitte.map(row).join('')}
    </table>
    ${entries.length===0 ? '<p class="readonly-note">Nessun dato disponibile.</p>' : ''}
  </div>`;
}

function renderStatsHeadToHead(pool){
  const byOpp = {};
  pool.forEach(m=>{
    const opp = m.casa===TEAM ? m.trasferta : m.casa;
    (byOpp[opp] = byOpp[opp] || []).push(m);
  });
  const rows = Object.keys(byOpp).sort().map(opp=>{
    const list = byOpp[opp];
    const w = list.filter(m=>m.risultato.esito==='V').length;
    const open = expandedOpponent===opp;
    const history = open ? `<div class="h2h-history">${list.map(m=>{
      const dett = m.risultato.sets.map(s=>s.gv+'-'+s.opp).join(', ');
      return `<div class="h2h-row"><span>${fmtData(m.data)}</span><span class="${m.risultato.esito==='V'?'won':'lost'}">${m.risultato.score}</span><span class="h2h-sets">${dett}</span></div>`;
    }).join('')}</div>` : '';
    return `<div class="h2h-item">
      <button class="h2h-head" onclick="toggleOpponent('${opp.replace(/'/g,"\\'")}')">
        <span>${escapeHtml(opp)}</span><span class="h2h-record">${w}V - ${list.length-w}P</span>
      </button>
      ${history}
    </div>`;
  }).join('');
  return `<div class="stats-section"><h3>Scontri diretti</h3>${rows}</div>`;
}

function renderStatsCompare(pool){
  let html = `<div class="stats-section"><h3>Confronto stagioni e campionati</h3>`;
  if(statSeason==='tutte'){
    const seasons=[...new Set(pool.map(m=>m.stagione))].sort();
    html += `<p class="chart-title">% vittorie per stagione</p>` + seasons.map(s=>{
      const sub=pool.filter(m=>m.stagione===s);
      return statBar(s, pct(sub.filter(m=>m.risultato.esito==='V').length, sub.length));
    }).join('');
  }
  if(statCampionato==='tutti'){
    const camps=[...new Set(pool.map(m=>m.campionato))].sort();
    html += `<p class="chart-title">% vittorie per campionato</p>` + camps.map(c=>{
      const sub=pool.filter(m=>m.campionato===c);
      return statBar(c, pct(sub.filter(m=>m.risultato.esito==='V').length, sub.length), campColor(c));
    }).join('');
  }
  html += '</div>';
  return html;
}

function renderStatsLikes(pool){
  const opponentOf = m => m.casa===TEAM ? m.trasferta : m.casa;
  const withVotes = pool
    .map(m=>{
      const voti = m.voti || {};
      const like = Object.values(voti).filter(v=>v==='like').length;
      const unlike = Object.values(voti).filter(v=>v==='unlike').length;
      return { m, like, unlike, tot: like+unlike };
    })
    .filter(x=>x.tot>0);

  if(withVotes.length===0){
    return `<div class="stats-section"><h3>Like alle partite</h3><p class="readonly-note">Nessun like o unlike ancora messo per questa selezione.</p></div>`;
  }

  const totLike = withVotes.reduce((a,x)=>a+x.like,0);
  const totUnlike = withVotes.reduce((a,x)=>a+x.unlike,0);
  const piuPiaciute = [...withVotes].sort((a,b)=> (b.like-b.unlike)-(a.like-a.unlike) || b.like-a.like).slice(0,5);
  const piuContestata = [...withVotes].sort((a,b)=> b.unlike-a.unlike)[0];

  const rows = piuPiaciute.map(x=>`
    <div class="synth-row" onclick="openModal('${x.m.n}')">
      <div class="synth-main">
        <span class="synth-opp">${escapeHtml(opponentOf(x.m))}</span>
        <span class="synth-date">${fmtData(x.m.data)} · ${escapeHtml(x.m.campionato)}</span>
      </div>
      <span class="synth-ha">👍 ${x.like}</span>
      <span class="synth-score">👎 ${x.unlike}</span>
      <span></span>
    </div>`).join('');

  return `<div class="stats-section">
    <h3>Like alle partite</h3>
    <div class="stat-grid">
      <div class="stat-card win"><span class="stat-num">${totLike}</span><span class="stat-label">Like totali</span></div>
      <div class="stat-card loss"><span class="stat-num">${totUnlike}</span><span class="stat-label">Unlike totali</span></div>
      <div class="stat-card"><span class="stat-num">${withVotes.length}</span><span class="stat-label">Partite votate</span></div>
      <div class="stat-card"><span class="stat-num">${(totLike/withVotes.length).toFixed(1)}</span><span class="stat-label">Like medi/partita votata</span></div>
    </div>
    <p class="chart-title">Partite più piaciute</p>
    <div class="synth-list">${rows}</div>
    ${piuContestata && piuContestata.unlike>0 ? `<p class="readonly-note">Partita più contestata: <b>${escapeHtml(opponentOf(piuContestata.m))}</b> (${fmtData(piuContestata.m.data)}) con ${piuContestata.unlike} unlike</p>` : ''}
  </div>`;
}

function renderStats(){
  const main = document.getElementById('main');
  const allSeasons = getSeasons();
  const campPool = matches.filter(m=> statSeason==='tutte' || m.stagione===statSeason);
  const allCamps = [...new Set(campPool.map(m=>m.campionato))].sort();

  let html = `<div class="stats-filters">
    <select onchange="onStatSeasonChange(this.value)">
      <option value="tutte" ${statSeason==='tutte'?'selected':''}>Tutte le stagioni</option>
      ${allSeasons.map(s=>`<option value="${escapeHtml(s)}" ${s===statSeason?'selected':''}>${escapeHtml(s)}</option>`).join('')}
    </select>
    <select onchange="onStatCampChange(this.value)">
      <option value="tutti" ${statCampionato==='tutti'?'selected':''}>Tutti i campionati</option>
      ${allCamps.map(c=>`<option value="${escapeHtml(c)}" ${c===statCampionato?'selected':''}>${escapeHtml(c)}</option>`).join('')}
    </select>
  </div>`;

  const likesPool = campPool.filter(m=> statCampionato==='tutti' || m.campionato===statCampionato);

  const pool = statsPool();
  if(pool.length===0){
    html += `<p class="readonly-note">Nessuna partita giocata per questa selezione.</p>`;
    html += renderStatsLikes(likesPool);
    main.innerHTML = html;
    return;
  }
  html += renderStatsSummary(pool);
  html += renderStatsBadges(pool);
  html += renderStatsLikes(likesPool);
  html += renderStatsTrend(pool);
  html += renderStatsHomeAway(pool);
  html += renderStatsBySet(pool);
  html += renderStatsScoreDist(pool);
  html += renderStatsHeadToHead(pool);
  if(statSeason==='tutte' || statCampionato==='tutti') html += renderStatsCompare(pool);
  main.innerHTML = html;
}

/* ===== LISTA SINTETICA ===== */
let synthSeason = null;
let synthCamp = 'tutti';

function onSynthSeason(v){ synthSeason = v; synthCamp = 'tutti'; renderSynth(); }
function onSynthCamp(v){ synthCamp = v; renderSynth(); }

function renderSynth(){
  const main = document.getElementById('main');
  const seasons = getSeasons();
  if(synthSeason === null) synthSeason = seasons[0];
  const campPool = matches.filter(m => synthSeason==='tutte' || m.stagione===synthSeason);
  const camps = [...new Set(campPool.map(m=>m.campionato))].sort();
  if(synthCamp !== 'tutti' && !camps.includes(synthCamp)) synthCamp = 'tutti';

  const pool = campPool
    .filter(m => synthCamp==='tutti' || m.campionato===synthCamp)
    .sort((a,b)=>(a.data+a.ora).localeCompare(b.data+b.ora));

  const giocate = pool.filter(m=>m.risultato);
  const daGiocare = pool.filter(m=>!m.risultato);
  const vinte = giocate.filter(m=>m.risultato.esito==='V').length;
  let puntiF = 0, puntiS = 0;
  giocate.forEach(m=>{ const p = matchPoints(m); puntiF += p.gv; puntiS += p.opp; });

  let html = `<div class="stats-filters">
    <select onchange="onSynthSeason(this.value)">
      <option value="tutte" ${synthSeason==='tutte'?'selected':''}>Tutte le stagioni</option>
      ${seasons.map(s=>`<option value="${escapeHtml(s)}" ${s===synthSeason?'selected':''}>${escapeHtml(s)}</option>`).join('')}
    </select>
    <select onchange="onSynthCamp(this.value)">
      <option value="tutti" ${synthCamp==='tutti'?'selected':''}>Tutti i campionati</option>
      ${camps.map(c=>`<option value="${escapeHtml(c)}" ${c===synthCamp?'selected':''}>${escapeHtml(c)}</option>`).join('')}
    </select>
  </div>
  <div class="stat-grid synth-summary">
    <div class="stat-card"><span class="stat-num">${giocate.length}</span><span class="stat-label">Giocate</span></div>
    <div class="stat-card"><span class="stat-num">${daGiocare.length}</span><span class="stat-label">Da giocare</span></div>
    <div class="stat-card"><span class="stat-num">${daGiocare.filter(m=>m.casa===TEAM).length}</span><span class="stat-label">Da giocare in casa</span></div>
    <div class="stat-card"><span class="stat-num">${daGiocare.filter(m=>m.casa!==TEAM).length}</span><span class="stat-label">Da giocare in trasferta</span></div>
    <div class="stat-card win"><span class="stat-num">${vinte}</span><span class="stat-label">Vinte</span></div>
    <div class="stat-card loss"><span class="stat-num">${giocate.length-vinte}</span><span class="stat-label">Perse</span></div>
    <div class="stat-card"><span class="stat-num">${puntiF}</span><span class="stat-label">Punti fatti</span></div>
    <div class="stat-card"><span class="stat-num">${puntiS}</span><span class="stat-label">Punti subiti</span></div>
  </div>`;

  if(pool.length === 0){
    html += `<p class="readonly-note">Nessuna partita per questa selezione.</p>`;
    main.innerHTML = html;
    return;
  }

  html += `<div class="synth-list">` + pool.map(m=>{
    const isHome = m.casa === TEAM;
    const opp = isHome ? m.trasferta : m.casa;
    const r = m.risultato;
    const score = r ? escapeHtml(r.score) : '';
    const icon = r ? (r.esito==='V' ? '<span class="set-icon won">✓</span>' : '<span class="set-icon lost">✗</span>') : '<span class="set-icon"></span>';
    return `<div class="synth-row ${r ? (r.esito==='V'?'row-win':'row-loss') : ''}" onclick="openModal('${m.n}')">
      <div class="synth-main">
        <span class="synth-opp">${escapeHtml(opp)}</span>
        <span class="synth-date">${fmtData(m.data)} · ${m.ora}</span>
      </div>
      <span class="synth-ha">${isHome ? '🏠 Casa' : '🚌 Trasf.'}</span>
      <span class="synth-score">${score}</span>
      ${icon}
    </div>`;
  }).join('') + `</div>`;
  main.innerHTML = html;
}

/* ===== Esportazione CSV ===== */

function csvEscape(v){
  const s = v==null ? '' : String(v);
  if(/[",;\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}

function buildCsv(){
  const header = ['Stagione','Campionato','Giornata','Data','Ora','Casa','Trasferta','Impianto','Indirizzo','Citta','Prov',
    'Set1 GV','Set1 Opp','Set2 GV','Set2 Opp','Set3 GV','Set3 Opp','Set4 GV','Set4 Opp','Set5 GV','Set5 Opp',
    'Punteggio Set','Esito','Punti Fatti','Punti Subiti'];
  const sorted = [...matches].sort((a,b)=> (a.stagione+a.campionato+a.data+a.ora).localeCompare(b.stagione+b.campionato+b.data+b.ora));
  const rows = sorted.map(m=>{
    const r = m.risultato;
    const sets = r ? r.sets : [];
    const setCols = [];
    for(let i=0;i<5;i++){ setCols.push(sets[i]?sets[i].gv:''); setCols.push(sets[i]?sets[i].opp:''); }
    const puntiF = sets.reduce((a,s)=>a+s.gv,0);
    const puntiS = sets.reduce((a,s)=>a+s.opp,0);
    return [
      m.stagione, m.campionato, m.giornata, m.data, m.ora, m.casa, m.trasferta,
      m.impianto, m.indirizzo, m.citta, m.prov,
      ...setCols,
      r ? r.score : '', r ? (r.esito==='V'?'Vittoria':'Sconfitta') : '',
      r ? puntiF : '', r ? puntiS : ''
    ].map(csvEscape).join(';');
  });
  return '\uFEFF' + [header.map(csvEscape).join(';'), ...rows].join('\n');
}

function exportCsv(){
  const csv = buildCsv();
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'green-volley-partite.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showStatus('CSV scaricato');
}

/* ===== Installazione come app ===== */
(function initInstallBanner(){
  const banner = document.getElementById('install-banner');
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if(isStandalone) return;

  let deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    banner.style.display = 'flex';
    banner.innerHTML = `<span>📲 Installa l'app per un accesso più rapido</span>
      <div style="display:flex; gap:6px;">
        <button onclick="(async()=>{ const b=document.getElementById('install-banner'); if(window.__deferredPrompt){ window.__deferredPrompt.prompt(); await window.__deferredPrompt.userChoice; window.__deferredPrompt=null; } b.style.display='none'; })()">Installa</button>
        <button class="install-close" onclick="document.getElementById('install-banner').style.display='none'">✕</button>
      </div>`;
    window.__deferredPrompt = deferredPrompt;
  });

  const ua = navigator.userAgent;
  const isIOS = /iPad|iPhone|iPod/.test(ua);
  if(isIOS){
    banner.style.display = 'flex';
    banner.innerHTML = `<span>📲 Per installarla: tocca <b>Condividi</b> poi <b>Aggiungi a Home</b></span>
      <button class="install-close" onclick="document.getElementById('install-banner').style.display='none'">✕</button>`;
  }
})();

document.getElementById('btn-lista').classList.add('active');

(async function start(){
  // Nessun dato incorporato nel file: tutto arriva esclusivamente da data.json
  // tramite /api/data. Se la chiamata fallisce, l'app resta con 0 partite e
  // lo segnala, invece di mostrare dati vecchi o finti.
  const ok = await loadFromApi(false);
  if(!ok) showStatus('Impossibile caricare i dati da data.json');
  initFilters();
  initCalPosition();
  render();
  setInterval(()=>loadFromApi(false), 20000); // auto-refresh ogni 20s
})();
